<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daily Dose · Neighbourhood Café</title>
<meta name="theme-color" content="#1F4A3A">
<!-- shortcut: Google Fonts for the mockup only; the real app self-hosts (guide + GDPR) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Knewave&family=Work+Sans:wght@500;600;700;800&display=swap">
<style>
:root{
  --tile:#F3ECDF; --grout:#DCCFB8; --green:#1F4A3A; --green-2:#163829; --marble:#ECE8E1; --marble-vein:#D6D0C6;
  --gold:#E3A82B; --ink:#1D1A16; --ink-2:#5B5244; --sky-1:#9FD3EE; --sky-2:#E8F3F7; --street:#B7B1A8; --lamp:rgba(255,214,140,0);
  --font-display:'Knewave',cursive; --font-ui:'Work Sans',system-ui,sans-serif; --ease-out:cubic-bezier(.23,1,.32,1);
}
[data-time=night]{
  --tile:#E4CFA8; --grout:#C9AE80; --sky-1:#121A33; --sky-2:#2A2448; --street:#2B2A33; --lamp:rgba(255,200,110,.38);
}
*{box-sizing:border-box}
body{margin:0;background:var(--green);color:var(--ink);font-family:var(--font-ui);overscroll-behavior:none}
.app{max-width:430px;margin:0 auto;min-height:100svh;position:relative;overflow:hidden}
.scene{position:relative;height:812px;min-height:100svh;background:
  linear-gradient(var(--grout) 1px,transparent 1px) 0 0/30px 15px,
  linear-gradient(90deg,var(--grout) 1px,transparent 1px) 0 0/30px 30px,var(--tile)}
.scene::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 22% 22%,var(--lamp),transparent 38%),radial-gradient(circle at 78% 22%,var(--lamp),transparent 38%);z-index:6}

/* top bar sits on the tiles */
.top{position:absolute;top:0;left:0;right:0;z-index:7;display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 16px 0}
.top .spacer{flex:1}
.pill{display:flex;align-items:center;gap:4px;height:44px;padding:0 12px 0 8px;border-radius:999px;background:var(--green);color:#FFF4DE;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:var(--green);color:#FFF4DE;display:grid;place-items:center;cursor:pointer}
.date{font-weight:700;font-size:14px;color:var(--ink-2)}

/* pendant lamps */
.lamps{position:absolute;top:0;left:0;right:0;height:120px;z-index:5;pointer-events:none}
.pend{position:absolute;top:0;width:2px;height:70px;background:#3A332A}
.pend::after{content:'';position:absolute;top:70px;left:-22px;width:46px;height:24px;border-radius:24px 24px 4px 4px;background:var(--green);box-shadow:0 20px 30px rgba(255,210,130,.0)}
.pend::before{content:'';position:absolute;top:92px;left:-8px;width:18px;height:9px;border-radius:0 0 9px 9px;background:#FFE6A8}
[data-time=night] .pend::before{box-shadow:0 0 22px 10px rgba(255,214,140,.6)}
.p1{left:22%}.p2{left:78%}

/* the shop window, wordmark painted on the glass */
.window{position:absolute;left:14px;right:14px;top:118px;height:250px;border:10px solid var(--green);border-radius:6px;overflow:hidden;background:linear-gradient(var(--sky-1),var(--sky-2) 75%)}
.awning{position:absolute;top:0;left:0;right:0;height:26px;background:repeating-linear-gradient(90deg,#C8402B 0 26px,#F6EBDA 26px 52px);clip-path:polygon(0 0,100% 0,100% 70%,96% 100%,92% 70%,88% 100%,84% 70%,80% 100%,76% 70%,72% 100%,68% 70%,64% 100%,60% 70%,56% 100%,52% 70%,48% 100%,44% 70%,40% 100%,36% 70%,32% 100%,28% 70%,24% 100%,20% 70%,16% 100%,12% 70%,8% 100%,4% 70%,0 100%)}
.across{position:absolute;bottom:56px;left:0;right:0;height:120px;display:flex;gap:4px;align-items:flex-end}
.across span{flex:1;background:#8C6E57;opacity:.45}
[data-time=night] .across span{background:#1C1A2E;opacity:1;background-image:radial-gradient(#FFCF6E 2px,transparent 3px);background-size:16px 22px;background-position:4px 8px}
.lamppost{position:absolute;bottom:56px;left:70%;width:4px;height:110px;background:#2D2A26}
.lamppost::before{content:'';position:absolute;top:-8px;left:-8px;width:20px;height:12px;border-radius:6px;background:#2D2A26}
[data-time=night] .lamppost::after{content:'';position:absolute;top:-30px;left:-40px;width:84px;height:150px;background:radial-gradient(ellipse at top,rgba(255,215,140,.35),transparent 70%)}
.street{position:absolute;bottom:0;left:0;right:0;height:56px;background:var(--street);border-top:5px solid rgba(0,0,0,.18)}
.lanes{position:absolute;left:0;right:0;bottom:4px;height:60px}
.walker.lane0{bottom:34px;opacity:.7}.walker.lane1{bottom:16px}.walker.lane2{bottom:4px}
.painted{position:absolute;top:36px;left:0;right:0;text-align:center;font-family:var(--font-display);font-size:46px;line-height:1;color:var(--gold);text-shadow:2px 2px 0 #8A5A0E;z-index:2;margin:0;letter-spacing:.01em}
.painted small{display:block;font-family:var(--font-ui);font-size:12px;font-weight:800;letter-spacing:.04em;text-shadow:none;margin-top:6px;color:var(--gold)}
.friends{position:absolute;bottom:0;left:6px;right:96px;display:flex;justify-content:space-around;align-items:flex-end;z-index:3}
.friend{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;cursor:pointer;font:inherit}
.tag{font-size:11px;font-weight:800;background:#FFF4DE;color:var(--ink);padding:2px 7px;border-radius:4px;white-space:nowrap;border:2px solid var(--green)}
.tag.beat{background:var(--gold)}
.board{position:absolute;right:10px;bottom:4px;width:78px;z-index:3;background:#262A26;border:4px solid #6E4A2A;border-radius:4px;padding:6px 4px;color:#F1EEE6;text-align:center;font-size:11px;font-weight:700;line-height:1.15}
.board b{display:block;font-family:var(--font-display);font-size:17px;font-weight:400;color:#FFF}
.glare{position:absolute;inset:0;pointer-events:none;z-index:4;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.18) 40% 47%,transparent 47%)}

/* counter */
.counter{position:absolute;left:0;right:0;top:438px;bottom:0;background:var(--green)}
.counter::before{content:'';position:absolute;left:0;right:0;top:-18px;height:30px;background:linear-gradient(100deg,transparent 30%,var(--marble-vein) 31%,transparent 33%),linear-gradient(80deg,transparent 60%,var(--marble-vein) 61%,transparent 62%),var(--marble);border-radius:4px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.queue{position:absolute;left:150px;right:84px;top:368px;display:flex;justify-content:flex-start;gap:6px;align-items:flex-end;z-index:2}
.queue .q{display:flex;flex-direction:column;align-items:center;gap:2px;animation:idle 2.4s ease-in-out infinite}
.queue .q:nth-child(2n){animation-delay:.7s}
@keyframes idle{50%{transform:translateY(-2px)}}
.bubble{font-size:11px;font-weight:800;background:#FFF;border:2px solid var(--green);border-radius:8px;padding:2px 6px;white-space:nowrap}
.props{position:absolute;left:12px;right:12px;top:330px;display:flex;align-items:flex-end;justify-content:space-between;z-index:3;pointer-events:none}
.dog-spot{position:absolute;right:8px;top:356px;z-index:4}
.cups{position:absolute;left:12px;right:12px;top:462px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px 8px;z-index:3}
.cupbtn{background:none;border:2px solid transparent;border-radius:16px;padding:4px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font:inherit;color:#FFF4DE;min-height:44px}
.cupbtn .nm{font-family:var(--font-display);font-size:18px;line-height:1;color:#FFF4DE}
.cupbtn .res{font-size:12px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.cupbtn .res.play{color:#CFE3D6}
.cupbtn.next{border-color:var(--gold);background:rgba(227,168,43,.14)}
.cupbtn.next .cup{animation:hop 2.2s var(--ease-out) infinite}
@keyframes hop{0%,70%,100%{transform:translateY(0)}78%{transform:translateY(-8px)}86%{transform:translateY(0)}}
.cupbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.cta{position:absolute;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;align-items:center;z-index:7}
.serve{width:100%;height:58px;border:0;border-radius:14px;background:var(--gold);color:#2A1C05;font:800 18px var(--font-ui);cursor:pointer;box-shadow:0 5px 0 #8A5A0E}
.reset{color:#CFE3D6;font-size:13px;font-weight:700;display:flex;gap:6px}

.below{background:var(--green-2);color:#FFF4DE;padding:24px 16px 60px}
.below h2{font-family:var(--font-display);font-weight:400;font-size:26px;margin:0 0 10px;color:var(--gold)}
.frow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);min-height:56px}
.frow .who{flex:1}.frow b{display:block}.frow span{font-size:14px;color:#CFE3D6}
.stamps{display:flex;gap:3px}.stamps i{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,244,222,.35)}.stamps i.on{background:var(--gold);border-color:var(--gold)}

/* Dose complete: the sixth stamp thunks onto your loyalty card */
.done-layer{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:rgba(10,24,18,.7)}
[data-done] .done-layer{display:flex}
.card{width:320px;aspect-ratio:1.6;background:#FFF8EA;border-radius:14px;padding:18px;box-shadow:0 24px 50px rgba(0,0,0,.4);position:relative;color:var(--ink);animation:cardin 500ms var(--ease-out) both;background-image:radial-gradient(circle at 100% 0,rgba(227,168,43,.25),transparent 40%)}
@keyframes cardin{from{transform:translateY(30px) rotate(-4deg) scale(.95);opacity:0}}
.card h3{font-family:var(--font-display);font-weight:400;font-size:30px;margin:0;color:var(--green)}
.card .no{position:absolute;top:20px;right:18px;font-weight:800;font-size:13px;color:var(--ink-2)}
.card .row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:22px}
.stamp{aspect-ratio:1;border-radius:50%;border:3px solid var(--green);display:grid;place-items:center;transform:rotate(var(--r));animation:thunk 420ms var(--ease-out) both}
.stamp svg{width:70%;height:70%}
@keyframes thunk{0%{transform:scale(1.6) rotate(var(--r));opacity:0}60%{transform:scale(.92) rotate(var(--r));opacity:1}100%{transform:scale(1) rotate(var(--r))}}
.card .foot{position:absolute;bottom:16px;left:18px;right:18px;display:flex;justify-content:space-between;font-weight:700;font-size:13px;color:var(--ink-2)}
.done-actions{width:320px;display:flex;flex-direction:column;gap:8px}
.ghost{height:48px;border:0;background:none;color:#FFF4DE;font:700 16px var(--font-ui);cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <section class="scene" aria-label="The café">
    <div class="lamps" aria-hidden="true"><div class="pend p1"></div><div class="pend p2"></div></div>
    <header class="top">
      <span class="date" id="date"></span>
      <span class="spacer"></span>
      <span class="pill" id="streak"></span>
      <button class="icon-btn tap" aria-label="Mute café sounds" title="Mute café sounds">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg>
      </button>
    </header>

    <div class="window">
      <div class="across"><span style="height:80%"></span><span style="height:100%"></span><span style="height:70%"></span><span style="height:95%"></span><span style="height:60%"></span></div>
      <div class="lamppost"></div>
      <div class="street"></div>
      <div class="lanes" id="walkers"></div>
      <div class="awning"></div>
      <h1 class="painted">Daily Dose<small>FRESH PUZZLES DAILY</small></h1>
      <div class="friends" id="friends"></div>
      <div class="board"><b id="players"></b>in today</div>
      <div class="glare"></div>
    </div>

    <div class="queue" id="queue" aria-hidden="true"></div>
    <div class="props" id="props"></div>
    <div class="dog-spot" id="dog"></div>
    <div class="counter"></div>
    <div class="cups" id="cups"></div>

    <div class="cta">
      <button class="serve tap" id="serve"></button>
      <div class="reset">New drinks in <span class="roll" id="clock"></span></div>
    </div>
  </section>

  <section class="below">
    <h2>Regulars tonight</h2>
    <div id="flist"></div>
  </section>

  <div class="done-layer" role="dialog" aria-label="Dose complete">
    <div class="card">
      <h3>Dose complete</h3>
      <span class="no" id="cardno"></span>
      <div class="row" id="stamps"></div>
      <div class="foot"><span>Saturday 14 November</span><span>Card 12 in a row</span></div>
    </div>
    <div class="done-actions">
      <button class="serve tap">Share your card</button>
      <button class="ghost tap">Back to the café</button>
    </div>
  </div>
</div>

<script type="module">
import { data, night, person, walkers, crowdSize, cup, machine, cat, dog, flame, rollingClock, SHARED_CSS } from './cafe.js';
document.head.insertAdjacentHTML('beforeend', `<style>${SHARED_CSS}</style>`);
const $ = id => document.getElementById(id);
const open = data.games.filter(g => !g.done);
const next = data.games.find(g => g.key === data.suggestedNext && !g.done) || open[0];
$('date').textContent = 'Sat 14 Nov';
$('streak').innerHTML = flame(data.streak, 18) + data.streak;
$('players').textContent = data.playersToday.toLocaleString('en');
$('walkers').innerHTML = walkers(crowdSize(data.playersToday), { px: 4, seed: 3 });
$('friends').innerHTML = data.friends.map(f => `<button class="friend tap" aria-label="${f.name}: ${f.line}"><span class="tag ${f.beatYou ? 'beat' : ''}">${f.beatYou ? f.name + ' beat you' : f.name}</span>${person(f.look, 5)}</button>`).join('');
$('queue').innerHTML = open.map((g, i) => `<div class="q">${i === 0 ? `<span class="bubble">${g.drink}, please</span>` : ''}${person(i + 2, 4)}</div>`).join('');
$('props').innerHTML = machine({ body: '#2E2E2E', metal: '#E3A82B', w: 120 }) + cat({ fur: '#3B3B3F', stripe: '#2A2A2E', w: 70 }) + '<span style="width:70px"></span>';
$('dog').innerHTML = dog({ w: 64 });
$('cups').innerHTML = data.games.map(g => `<button class="cupbtn tap ${g === next ? 'next' : ''}" aria-label="${g.name}, ${g.done ? 'done, ' + g.result : 'play'}">
  ${cup(g, { body: '#FFFFFF', w: 46 })}<span class="nm">${g.name}</span><span class="res ${g.done ? '' : 'play'}">${g.done ? g.result : 'Play'}</span></button>`).join('');
$('serve').textContent = next ? `Serve ${next.name}` : 'Dose complete';
rollingClock($('clock'));
$('flist').innerHTML = [...data.friends, ...data.regulars].slice(0, 4).map(f => `<div class="frow">${person(f.look, 4)}<div class="who"><b>${f.name}</b><span>${f.line || 'Fills in until you add friends'}</span></div>${f.done != null ? `<div class="stamps" aria-label="${f.done} of 6">${Array.from({ length: 6 }, (_, i) => `<i class="${i < f.done ? 'on' : ''}"></i>`).join('')}</div>` : ''}</div>`).join('');
$('cardno').textContent = `No. ${data.puzzleNo}`;
$('stamps').innerHTML = data.games.map((g, i) => `<span class="stamp" style="--r:${[-8, 6, -3, 9, -6, 4][i]}deg;animation-delay:${200 + i * 120}ms;background:${g.colour}22;border-color:${g.colour}">${cup({ ...g, done: true }, { w: 30 })}</span>`).join('');
</script>
</body>
</html>
